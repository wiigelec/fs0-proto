name: FS0 Conformance

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  conformance:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Run canonical FS0 Conformance
        run: ./repo/scripts/validate --verbose
